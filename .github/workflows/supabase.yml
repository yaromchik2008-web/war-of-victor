# Deploys the War of Victor server to Supabase: database tables, the two functions, secrets and the bot webhook.
# Needs repository secrets: SUPABASE_ACCESS_TOKEN, SUPABASE_DB_PASSWORD, BOT_TOKEN
# The project id is not secret, so it is written below.
name: Deploy server (Supabase)

on:
  push:
    branches: [main]
    paths: ["supabase/**", ".github/workflows/supabase.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      PROJECT_REF: ggbvjcdbiqqjwjgyuuqc
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      GAME_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Check settings
        run: |
          for v in SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD PROJECT_REF BOT_TOKEN; do
            if [ -z "${!v}" ]; then echo "::error::$v is not set in the repository settings"; exit 1; fi
          done
      - name: Link project
        run: supabase link --project-ref "$PROJECT_REF"
      - name: Database tables
        run: supabase db push --remote --yes --password "$SUPABASE_DB_PASSWORD"
      - name: Function secrets
        run: supabase secrets set --project-ref "$PROJECT_REF" --yes BOT_TOKEN="$BOT_TOKEN" GAME_URL="$GAME_URL"
      - name: Functions
        run: supabase functions deploy --project-ref "$PROJECT_REF" --no-verify-jwt --yes
      - name: Bot webhook
        run: |
          SECRET=$(printf '%s' "wov-webhook:$BOT_TOKEN" | sha256sum | cut -d' ' -f1)
          curl -sS "https://api.telegram.org/bot$BOT_TOKEN/setWebhook" \
            -d "url=https://$PROJECT_REF.supabase.co/functions/v1/tg-webhook" \
            -d "secret_token=$SECRET" \
            -d 'allowed_updates=["message","pre_checkout_query"]' | grep -q '"ok":true'
          curl -sS "https://api.telegram.org/bot$BOT_TOKEN/setMyCommands" -H 'content-type: application/json' \
            -d '{"commands":[{"command":"start","description":"Почати гру"},{"command":"paysupport","description":"Допомога з оплатою"}]}' > /dev/null
          echo "Webhook set"
